[project]
name = "jarida-rag"
version = "0.1.0"
description = "RAG over the Moroccan Official Gazette (الجريدة الرسمية)"
requires-python = ">=3.10"
dependencies = [
    "pypdfium2",
    "ragas==0.2.15",
    "langchain-community<0.4",
    "langchain-core<1",
    "langchain-text-splitters<1",
    "langchain-huggingface<1",
    "sentence-transformers",
    "psycopg[binary,pool]",
    "pgvector",
    "transformers>=4.51",
    "accelerate",
    "bitsandbytes",
    "mlflow",
    "pandas",
    "wordfreq>=3.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
